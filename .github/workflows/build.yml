name: build-apk

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      # action 都跟着当前主版本走：v4 那一代是 Node20，runner 已在强制用 Node24 跑并告警，
      # 升上去既消掉告警，也免得哪天旧版直接停服。输入项（distribution / java-version /
      # path / if-no-files-found / files）在各新版里都还在，不需要改调用写法。
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # 不再用 android-actions/setup-android：新版 runner 的 cmdline-tools 16
      # 已经没有 "tools" 包，那个 action 一跑就报「未找到包 tools」直接失败。
      # 镜像本身自带 SDK，缺什么就用自带的 sdkmanager 补。
      - name: 准备 Android SDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID SDK = $SDK"
          if [ ! -x "$SDK/build-tools/34.0.0/aapt2" ] || [ ! -f "$SDK/platforms/android-34/android.jar" ]; then
            SM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1)
            if [ -z "$SM" ]; then echo "找不到 sdkmanager"; exit 1; fi
            echo "用 $SM 安装缺失组件"
            yes | "$SM" --licenses > /dev/null 2>&1 || true
            "$SM" "platforms;android-34" "build-tools;34.0.0"
          fi
          echo "build-tools:"; ls "$SDK/build-tools"
          echo "platforms:"; ls "$SDK/platforms"

      # 签名私钥只从仓库机密读取，不落仓库（公开仓库里放 keystore 等于把签名公开）。
      # 没配 KEYSTORE_B64 也能构建，但签出来的是临时密钥，无法覆盖安装已装版本。
      #
      # 「Secret 没配」和「Secret 配了但解不开」必须分开报：前者是没设置，
      # 后者是 base64 贴坏了或密码不是 android——以前两种都只说一句「用临时签名」，
      # 结果日志里看不出到底是哪一种，只能靠猜。
      - name: 签名
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          rm -f debug.keystore
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::Secret KEYSTORE_B64 为空（未配置）。本次用临时签名，不能覆盖安装已装版本"
            # 标记一下，让后面的发 Release 步骤跳过：
            # 临时签名装不上，发出去只会让人下载到一个「应用未安装」的包
            echo "SIGNED_TEMP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > debug.keystore 2>/dev/null || true
          if ! keytool -list -keystore debug.keystore -storepass android > /dev/null 2>&1; then
            echo "::error::KEYSTORE_B64 有内容但读不出来：不是有效 base64，或密钥库密码不是 android"
            rm -f debug.keystore
            exit 1
          fi
          # 打出证书指纹：和本地 `keytool -list` 的 SHA256 比一下，
          # 就知道 CI 用的是不是同一把钥匙（指纹是公开信息，私钥不外泄）
          FP=$(keytool -list -v -keystore debug.keystore -storepass android 2>/dev/null \
                | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1)
          echo "签名就绪 SHA256: ${FP:-（读不到指纹）}"

      - name: 编译
        run: |
          chmod +x build.sh
          ./build.sh

      - name: 重命名产物
        run: |
          V=$(grep -oP 'versionName="\K[^"]+' AndroidManifest.xml)
          cp eink-toolbox.apk "eink-toolbox-v$V.apk"
          echo "APK=eink-toolbox-v$V.apk" >> "$GITHUB_ENV"
          echo "版本 $V" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: ink-tools-apk
          path: ${{ env.APK }}
          if-no-files-found: error

      # 推到 main 且版本号是新的，就直接发 Release（tag 由 gh 自动建）。
      # 这样每次改完 versionName 推上去，Release 里就有固定下载链接，不用手动打 tag。
      # 临时签名（SIGNED_TEMP）时跳过：那个包装不上已装版本，发出去只会让人白下载。
      - name: 发 Release（同版本已存在则跳过）
        if: github.ref == 'refs/heads/main' && env.SIGNED_TEMP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep -oP 'versionName="\K[^"]+' AndroidManifest.xml)
          if gh release view "v$V" > /dev/null 2>&1; then
            echo "v$V 已存在，只更新文件"
            gh release upload "v$V" "$APK" --clobber
          else
            gh release create "v$V" "$APK" \
              --title "Ink Tools v$V" \
              --notes "由 GitHub Actions 自动构建 · commit $GITHUB_SHA"
          fi

      - name: 附到 Release（打 tag 时）
        if: startsWith(github.ref, 'refs/tags/') && env.SIGNED_TEMP != '1'
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.APK }}
